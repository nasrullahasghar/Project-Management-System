<div class="report-container">
  @if (sourceProjectId(); as pid) {
    <a mat-button [routerLink]="['/projects', pid, 'reports']">
      <mat-icon>arrow_back</mat-icon>
      Back to Reports
    </a>
  } @else {
    <a mat-button routerLink="/projects">
      <mat-icon>arrow_back</mat-icon>
      Back to Projects
    </a>
  }

  <mat-card class="report-card" [class.hidden]="!data()">
    <mat-card-header>
      <mat-card-title>Global Task Breakdown</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div class="charts-row">
        <div class="chart-block">
          <h3>By Status</h3>
          <div class="chart-wrapper">
            <canvas #statusCanvas></canvas>
          </div>
        </div>

        <div class="chart-block">
          <h3>By Priority</h3>
          <div class="chart-wrapper">
            <canvas #priorityCanvas></canvas>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
